<!DOCTYPE html>
<html>
	<head>
		<title>Chatbot</title>
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
		<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">
		<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
		<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css')}}"/>
	</head>
	
	
	<body>
		<div class="container-fluid h-100">
			<div class="row justify-content-center h-100">		
				<div class="col-md-8 col-xl-6 chat">
					<div class="card">
						<div class="card-header msg_head">
							<div class="d-flex bd-highlight">
								<div class="img_cont">
									<img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img" alt="Medical assistant">
									<!-- <img src="https://www.prdistribution.com/spirit/uploads/pressreleases/2019/newsreleases/d83341deb75c4c4f6b113f27b1e42cd8-chatbot-florence-already-helps-thousands-of-patients-to-remember-their-medication.png" class="rounded-circle user_img"> -->
									<span class="online_icon"></span>
								</div>
								<div class="user_info">
									<span>Medical Chatbot</span>
									<p>Ask me anything!</p>
								</div>
							</div>
						</div>
						<div id="messageFormeight" class="card-body msg_card_body" aria-live="polite">
							
							
						</div>
						<div class="card-footer">
							<form id="messageArea" class="input-group">
                                <input type="text" id="text" name="msg" placeholder="Type your message..." aria-label="Message" autocomplete="off" class="form-control type_msg" required/>
								<div class="input-group-append">
									<button type="submit" id="send" class="input-group-text send_btn"><i class="fas fa-location-arrow"></i></button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
		
		<script>
			$(document).ready(function() {
				const messages = $("#messageFormeight");
				const input = $("#text");
				const sendButton = $("#send");

				function appendMessage(text, isUser) {
					const date = new Date();
					const time = date.toLocaleTimeString([], {
						hour: "2-digit",
						minute: "2-digit"
					});
					const row = $("<div>").addClass(
						"d-flex justify-content-" + (isUser ? "end" : "start") + " mb-4"
					);
					const avatar = $("<img>", {
						src: isUser
							? "https://i.ibb.co/d5b84Xw/Untitled-design.png"
							: "https://cdn-icons-png.flaticon.com/512/387/387569.png",
						alt: isUser ? "You" : "Medical assistant"
					}).addClass("rounded-circle user_img_msg");
					const bubble = $("<div>")
						.addClass(isUser ? "msg_cotainer_send" : "msg_cotainer")
						.text(text);
					const timestamp = $("<span>")
						.addClass(isUser ? "msg_time_send" : "msg_time")
						.text(time);

					bubble.append(timestamp);
					if (isUser) {
						row.append(bubble, $("<div>").addClass("img_cont_msg").append(avatar));
					} else {
						row.append($("<div>").addClass("img_cont_msg").append(avatar), bubble);
					}
					messages.append(row).scrollTop(messages[0].scrollHeight);
				}

				$("#messageArea").on("submit", function(event) {
					event.preventDefault();
					const message = input.val().trim();
					if (!message) {
						return;
					}

					appendMessage(message, true);
					input.val("").prop("disabled", true);
					sendButton.prop("disabled", true);
					$.ajax({
						data: {msg: message},
						dataType: "json",
						method: "POST",
						url: "{{ url_for('chat') }}"
					}).done(function(data) {
						appendMessage(data.answer, false);
					}).fail(function(xhr) {
						const errorMessage = xhr.responseJSON && xhr.responseJSON.error
							? xhr.responseJSON.error
							: "Sorry, the message could not be sent. Please try again.";
						appendMessage(errorMessage, false);
					}).always(function() {
						input.prop("disabled", false).trigger("focus");
						sendButton.prop("disabled", false);
					});
				});
			});
		</script>
        
    </body>
</html>
