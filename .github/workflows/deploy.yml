name: Build and deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Validate Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t medical-assistant:${{ github.sha }} .

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/medical-assistant
            git fetch origin main
            git reset --hard origin/main
            sudo docker build -t medical-assistant:${{ github.sha }} .
            sudo docker rm -f medical-assistant || true
            sudo docker run -d \
              --name medical-assistant \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file /home/ubuntu/medical-assistant/.env \
              medical-assistant:${{ github.sha }}
            sudo docker image prune -f
